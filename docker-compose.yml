services:
    db:
        image: postgres:latest
        container_name: db
        restart: always
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        volumes:
            - postgres_data:/var/lib/postgresql

    redis:
        image: redis:latest
        container_name: redis
        restart: always

    app:
        build:
            context: .
            dockerfile: Dockerfile.dev
        container_name: app
        restart: always
        working_dir: /app
        volumes:
            - .:/app
            - /app/node_modules
        ports:
            - '${PORT}:${PORT}'
            - '24678:24678'
        environment:
            - CHOKIDAR_USEPOLLING=true
            - WATCHPACK_POLLING=true
        command: node ace serve --hmr
        depends_on:
            - db
            - redis

    adminer:
        image: ghcr.io/shyim/adminerevo:latest
        container_name: adminer
        restart: always
        ports:
            - '8080:8080'
        depends_on:
            - db

volumes:
    postgres_data:
